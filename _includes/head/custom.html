<style>
  :root {
    --portfolio-blue: #1a73e8;
    --portfolio-green: #188038;
    --portfolio-yellow: #fbbc04;
    --portfolio-red: #d93025;
    --portfolio-ink: #202124;
    --portfolio-muted: #5f6368;
    --portfolio-line: #dfe3ea;
    --portfolio-bg: #f7f9fc;
    --portfolio-card: #ffffff;
  }

  body {
    color: var(--portfolio-ink);
  }

  .masthead {
    border-top: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--portfolio-blue), var(--portfolio-green), var(--portfolio-yellow), var(--portfolio-red)) 1;
    box-shadow: 0 1px 18px rgba(60, 64, 67, 0.08);
  }

  .greedy-nav .visible-links a::before {
    height: 3px;
    background: linear-gradient(90deg, var(--portfolio-blue), var(--portfolio-green));
  }

  .page__content h2 {
    position: relative;
    padding-bottom: 0.6rem;
    border-bottom-color: var(--portfolio-line);
  }

  .page__content h2::before {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 5.5rem;
    height: 3px;
    content: "";
    background: linear-gradient(90deg, var(--portfolio-blue), var(--portfolio-green), var(--portfolio-yellow));
    border-radius: 999px;
  }

  .archive__item {
    padding: 1rem;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--portfolio-line);
    border-left: 4px solid var(--portfolio-blue);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(60, 64, 67, 0.06);
  }

  .list__item:nth-of-type(4n + 2) .archive__item,
  .grid__item:nth-of-type(4n + 2) .archive__item {
    border-left-color: var(--portfolio-green);
  }

  .list__item:nth-of-type(4n + 3) .archive__item,
  .grid__item:nth-of-type(4n + 3) .archive__item {
    border-left-color: var(--portfolio-yellow);
  }

  .list__item:nth-of-type(4n + 4) .archive__item,
  .grid__item:nth-of-type(4n + 4) .archive__item {
    border-left-color: var(--portfolio-red);
  }

  .sidebar .author__avatar img {
    border: 4px solid #fff;
    box-shadow: 0 10px 26px rgba(60, 64, 67, 0.16);
  }

  .sidebar .author__name {
    color: var(--portfolio-ink);
  }

  .author__urls a:hover {
    color: var(--portfolio-blue);
    background: rgba(26, 115, 232, 0.07);
    text-decoration: none;
  }

  .scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    width: 100%;
    height: 3px;
    pointer-events: none;
    background: linear-gradient(90deg, var(--portfolio-blue), var(--portfolio-green), var(--portfolio-yellow), var(--portfolio-red));
    transform: scaleX(0);
    transform-origin: left center;
  }

  body.home-page {
    background:
      linear-gradient(90deg, rgba(26, 115, 232, 0.045) 1px, transparent 1px) 0 0 / 72px 72px,
      linear-gradient(180deg, rgba(24, 128, 56, 0.04) 1px, transparent 1px) 0 0 / 72px 72px,
      linear-gradient(180deg, #ffffff 0%, var(--portfolio-bg) 72%);
  }

  body.home-page .page__inner-wrap > header {
    display: none;
  }

  body.home-page #main {
    margin-top: 2rem;
  }

  body.home-page .page__content > h2:first-of-type {
    margin-top: 2.25rem;
  }

  .profile-hero {
    position: relative;
    max-width: 780px;
    margin: 0 0 1.25rem;
    padding: 1.35rem 1.45rem 1.25rem;
    overflow: hidden;
    color: var(--portfolio-ink);
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(247, 249, 252, 0.92)),
      linear-gradient(90deg, var(--portfolio-blue), var(--portfolio-green), var(--portfolio-yellow), var(--portfolio-red));
    border: 1px solid var(--portfolio-line);
    border-radius: 8px;
    box-shadow: 0 14px 38px rgba(60, 64, 67, 0.11);
  }

  .profile-hero::before {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    background:
      linear-gradient(90deg, var(--portfolio-blue) 0 25%, var(--portfolio-green) 25% 50%, var(--portfolio-yellow) 50% 75%, var(--portfolio-red) 75% 100%) top left / 100% 5px no-repeat;
    animation: profile-signal 7s linear infinite;
  }

  .profile-hero__copy {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .profile-kicker {
    margin: 0 0 0.72rem !important;
    color: var(--portfolio-blue);
    font-size: 0.72rem !important;
    font-weight: 800;
    letter-spacing: 0;
    line-height: 1.35 !important;
    text-transform: uppercase;
  }

  .profile-hero h1 {
    max-width: 640px;
    margin: 0;
    color: var(--portfolio-ink);
    font-size: 2.35rem;
    font-weight: 850;
    line-height: 1.06;
    letter-spacing: 0;
  }

  .profile-rotator {
    display: inline-block;
    color: var(--portfolio-blue);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .profile-rotator.is-changing {
    opacity: 0;
    transform: translateY(0.35rem);
  }

  .profile-lede {
    max-width: 720px;
    margin: 0.8rem 0 0 !important;
    color: var(--portfolio-muted);
    font-size: 0.96rem !important;
    line-height: 1.6 !important;
  }

  .profile-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .profile-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.1rem;
    padding: 0.48rem 0.78rem;
    color: var(--portfolio-blue) !important;
    font-size: 0.86rem;
    font-weight: 800;
    line-height: 1;
    text-decoration: none !important;
    background: #fff;
    border: 1px solid rgba(26, 115, 232, 0.26);
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(60, 64, 67, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
  }

  .profile-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(60, 64, 67, 0.14);
  }

  .profile-button--primary {
    color: #fff !important;
    background: var(--portfolio-blue);
    border-color: var(--portfolio-blue);
  }

  .profile-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.38rem;
    margin-top: 0.85rem;
  }

  .profile-tags span {
    display: inline-flex;
    padding: 0.3rem 0.52rem;
    color: #3c4043;
    font-size: 0.76rem;
    font-weight: 750;
    background: rgba(255, 255, 255, 0.74);
    border: 1px solid var(--portfolio-line);
    border-radius: 999px;
  }

  .profile-pipeline {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    max-width: 440px;
    margin-top: 0.85rem;
    padding: 0.58rem 0.68rem;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--portfolio-line);
    border-radius: 8px;
  }

  .profile-pipeline span {
    color: var(--portfolio-ink);
    font-size: 0.7rem;
    font-weight: 850;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .profile-pipeline i {
    position: relative;
    flex: 1 1 2.8rem;
    min-width: 2.8rem;
    height: 2px;
    overflow: hidden;
    background: rgba(95, 99, 104, 0.22);
    border-radius: 999px;
  }

  .profile-pipeline i::after {
    position: absolute;
    inset: 0;
    content: "";
    background: linear-gradient(90deg, transparent, var(--portfolio-blue), transparent);
    transform: translateX(-100%);
    animation: pipeline-flow 2.8s ease-in-out infinite;
  }

  .profile-pipeline i:nth-of-type(2)::after {
    animation-delay: 0.55s;
  }

  .profile-snapshot {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.75rem;
    max-width: 780px;
    margin: 0.9rem 0 2rem;
  }

  .profile-snapshot article {
    min-width: 0;
    padding: 0.86rem;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--portfolio-line);
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(60, 64, 67, 0.07);
  }

  .profile-snapshot article:nth-child(1) {
    border-top: 4px solid var(--portfolio-blue);
  }

  .profile-snapshot article:nth-child(2) {
    border-top: 4px solid var(--portfolio-green);
  }

  .profile-snapshot article:nth-child(3) {
    border-top: 4px solid var(--portfolio-yellow);
  }

  .profile-snapshot span {
    display: block;
    margin-bottom: 0.38rem;
    color: var(--portfolio-muted);
    font-size: 0.72rem;
    font-weight: 850;
    letter-spacing: 0;
    line-height: 1.35;
    text-transform: uppercase;
  }

  .profile-snapshot strong {
    display: block;
    color: var(--portfolio-ink) !important;
    font-size: 0.92rem;
    line-height: 1.35;
  }

  .profile-snapshot p {
    margin: 0.46rem 0 0 !important;
    color: var(--portfolio-muted);
    font-size: 0.86rem !important;
    line-height: 1.55 !important;
  }

  [data-reveal] {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  [data-reveal].is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @keyframes profile-signal {
    0% {
      background-position: -100% 0;
    }
    100% {
      background-position: 100% 0;
    }
  }

  @keyframes pipeline-flow {
    0% {
      transform: translateX(-100%);
    }
    45%, 55% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(100%);
    }
  }

  @media (max-width: 900px) {
    .profile-hero {
      padding: 1rem;
    }

    .profile-hero__copy {
      padding: 0;
    }

    .profile-snapshot {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 560px) {
    .profile-hero {
      border-radius: 8px;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr;
    }

    .profile-button {
      width: 100%;
    }

    .profile-hero h1 {
      font-size: 1.9rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .profile-hero::before,
    .profile-pipeline i::after {
      animation: none;
    }

    .profile-rotator,
    [data-reveal],
    .profile-button {
      transition: none;
    }

    [data-reveal] {
      opacity: 1;
      transform: none;
    }
  }
</style>
